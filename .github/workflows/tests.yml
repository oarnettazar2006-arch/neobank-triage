name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests unitaires et test de bout en bout (réponses du LLM enregistrées, sans Ollama)
        run: make test
      - name: Cas d'injection du notebook (tâche 4)
        run: python -m unittest -v tests.test_pipeline_replay.PipelineReplayTest.test_notebook_injection_case

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - name: Tests de l'API (LLM simulé, sans Ollama)
        run: python -m unittest discover -s api/tests -t . -v

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Lint (dont react/no-danger et l'interdiction de Date)
        run: npm run lint
      - name: Build (vérification des types, puis Vite)
        run: npm run build
      - name: Tests du front (vitest)
        run: npm test
